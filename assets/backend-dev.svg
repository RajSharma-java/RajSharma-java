<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="1" y="1" width="398" height="318" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- soft glow blob -->
  <ellipse cx="200" cy="165" rx="150" ry="105" fill="#00d4ff" opacity="0.06"/>

  <!-- floating symbols -->
  <g font-family="Fira Code, Consolas, monospace" font-weight="700" font-size="22" fill="#00d4ff">
    <text x="30" y="50">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="50" fill="#6db33f">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="195" y="38" fill="#ed8b00" font-size="18">API
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- CLIENT -->
  <rect x="18" y="125" width="92" height="76" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <rect x="18" y="125" width="92" height="16" rx="10" fill="#21262d"/>
  <circle cx="30" cy="133" r="3" fill="#ff5f56"/><circle cx="40" cy="133" r="3" fill="#ffbd2e"/><circle cx="50" cy="133" r="3" fill="#27c93f"/>
  <g font-family="Fira Code, Consolas, monospace" font-size="10" fill="#8b949e">
    <text x="26" y="160">GET /users</text>
    <text x="26" y="176" fill="#27c93f">200 OK</text>
    <text x="26" y="192" fill="#00d4ff">{ json }</text>
  </g>
  <text x="64" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Client</text>

  <!-- ARROWS -->
  <line x1="112" y1="150" x2="150" y2="150" stroke="#00d4ff" stroke-width="2.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="150" y1="176" x2="112" y2="176" stroke="#27c93f" stroke-width="2.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="250" y1="160" x2="290" y2="160" stroke="#ed8b00" stroke-width="2.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- SERVER STACK -->
  <g font-family="Fira Code, Consolas, monospace" font-size="11" fill="#e6edf3" text-anchor="middle">
    <rect x="150" y="80" width="100" height="48" rx="8" fill="#161b22" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="165" cy="96" r="4" fill="#27c93f"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="178" cy="96" r="4" fill="#ffbd2e"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="200" y="118">REST API</text>

    <rect x="150" y="136" width="100" height="48" rx="8" fill="#161b22" stroke="#6db33f" stroke-width="2"/>
    <circle cx="165" cy="152" r="4" fill="#27c93f"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="178" cy="152" r="4" fill="#00d4ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/></circle>
    <text x="200" y="174">Spring Boot</text>

    <rect x="150" y="192" width="100" height="48" rx="8" fill="#161b22" stroke="#ed8b00" stroke-width="2"/>
    <circle cx="165" cy="208" r="4" fill="#27c93f"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="178" cy="208" r="4" fill="#ff5f56"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/></circle>
    <text x="200" y="230">Java Logic</text>
  </g>
  <text x="200" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Server</text>

  <!-- DATABASE -->
  <g stroke="#00d4ff" stroke-width="2" fill="#161b22">
    <path d="M292 140 v62 a38 12 0 0 0 76 0 v-62"/>
    <ellipse cx="330" cy="140" rx="38" ry="12"/>
    <path d="M292 160 a38 12 0 0 0 76 0" fill="none"/>
    <path d="M292 181 a38 12 0 0 0 76 0" fill="none"/>
  </g>
  <text x="330" y="232" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#00d4ff">MySQL</text>
  <text x="330" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Database</text>

  <!-- ground + caption -->
  <line x1="20" y1="274" x2="380" y2="274" stroke="#30363d" stroke-width="2"/>
  <text x="200" y="302" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#e6edf3">Backend Developer</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
